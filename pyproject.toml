[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "procurement-agent"
version = "0.2.0"
description = "Автоматизация закупок: обработка документов, группировка по поставщикам, генерация заявок"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pdfplumber>=0.11.10",
    "pillow>=12.3.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "pytesseract>=0.3.0",
    "rich>=15.0.0",
    "thefuzz>=0.22.1",
    "rapidfuzz>=3.0.0",
    "typer>=0.26.8",
    "lxml>=5.0.0",
]

[project.scripts]
procurement = "main:app"

[tool.setuptools]
packages = ["core", "generators", "gui", "gui.components", "gui.services", "gui.styles", "gui.viewmodels", "gui.views", "mailer", "models", "parsers"]
py-modules = ["main", "gui_app", "config", "logging_setup", "build_entry"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF012", "B008", "N802"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
